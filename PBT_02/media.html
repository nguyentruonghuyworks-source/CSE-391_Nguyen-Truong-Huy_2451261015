<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Giới Thiệu Sản Phẩm Multimedia</title>
</head>
<body>
    <header>

        <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="2" fill="orange" />
        </svg>
        <h1>Sản Phẩm Mới</h1>
    </header>

    <main>
        <section>
            <h2>Hình Ảnh Sản Phẩm</h2>
            
            <figure>
                <img src="https://tse3.mm.bing.net/th/id/OIP.WL8GXeMb_3InksyqPGHtkQHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Ảnh sản phẩm điện thoại màu đen nguyên khối" loading="lazy" style="max-width: 100%; height: auto;">
                <figcaption>Sản phẩm 1: Điện thoại thông minh màu đen</figcaption>
            </figure>
            
            <figure>
                <img src="https://tse1.mm.bing.net/th/id/OIP.2gLS5iEjKAjg9blzY9wUegHaEK?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Ảnh sản phẩm điện thoại màu trắng" loading="lazy" style="max-width: 100%; height: auto;">
                <figcaption>Sản phẩm 2: Điện thoại thông minh màu trắng</figcaption>
            </figure>
            
            <figure>
                <img src="https://th.bing.com/th/id/R.93bd99c22349bee0f79005b2efe780c0?rik=82wAMQ%2fY9woR4w&pid=ImgRaw&r=0" alt="Ảnh tai nghe không dây chống ồn" loading="lazy" style="max-width: 100%; height: auto;">
                <figcaption>Sản phẩm 3: Phụ kiện tai nghe không dây</figcaption>
            </figure>
        </section>

        <section>
            <h2>Review Sản Phẩm từ YouTube</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/nNdJqUhyEGY?si=XRaMMkrRTqvwh2Id" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </section>

        <section>
            <h2>Video Giới Thiệu Chi Tiết</h2>
            <video width="400" height="300" controls poster="https://th.bing.com/th/id/OIP.DKMSHnZXFz0x-V_kXCQYRAHaHa?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">
                <source src="videos/taytraichitrang.mp4" type="video/mp4">
                <source src="videos/taytraichitrang.webm" type="video/webm">
                Đoạn văn bản này sẽ chỉ hiển thị khi trình duyệt không hỗ trợ thẻ video.
            </video>
        </section>

        <section>
            <h2>Nhạc Nền</h2>
            <audio controls>
                <source src="audios/taytraichitrang.mp3" type="audio/mpeg">
                Đoạn văn bản này sẽ chỉ hiển thị khi trình duyệt không hỗ trợ thẻ audio.
            </audio>
        </section>
    </main>
</body>
