<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation & Cards</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <h2>LOGO</h2>
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </div>
        <div class="nav-buttons">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <div class="container">
        <h2>Danh sách sản phẩm</h2>
        <div class="product-grid">
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 1">
                <div class="card-info">
                    <h3>Sản phẩm 1</h3>
                    <p class="price">150.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 2">
                <div class="card-info">
                    <h3>Sản phẩm 2</h3>
                    <p class="price">250.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 3">
                <div class="card-info">
                    <h3>Sản phẩm 3</h3>
                    <p class="price">350.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 4">
                <div class="card-info">
                    <h3>Sản phẩm 4</h3>
                    <p class="price">450.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 5">
                <div class="card-info">
                    <h3>Sản phẩm 5</h3>
                    <p class="price">550.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 6">
                <div class="card-info">
                    <h3>Sản phẩm 6</h3>
                    <p class="price">650.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 7">
                <div class="card-info">
                    <h3>Sản phẩm 7</h3>
                    <p class="price">750.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Sản phẩm 8">
                <div class="card-info">
                    <h3>Sản phẩm 8</h3>
                    <p class="price">850.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>
        </div>
    </div>

</body>
</html>
