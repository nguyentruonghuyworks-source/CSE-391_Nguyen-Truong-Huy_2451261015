<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="grid-container">
        
        <header class="header">
            <h2>HEADER (Full Width)</h2>
        </header>

        <section class="hero">
            <div class="hero-content">
                <h2>HERO BANNER</h2>
                <p>Khám phá bộ sưu tập mùa hè mới nhất!</p>
            </div>
            <div class="hero-featured-card">
                <h3>Sản phẩm nổi bật (Span 2)</h3>
                <p>Mặt hàng đang được giảm giá cực sốc trong hôm nay.</p>
                <button>Mua ngay</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc (Filter)</h3>
            <div class="filter-group">
                <label><input type="checkbox"> Điện thoại</label>
                <label><input type="checkbox"> Laptop</label>
                <label><input type="checkbox"> Máy tính bảng</label>
                <label><input type="checkbox"> Phụ kiện</label>
            </div>
        </aside>

        <main class="main-content">
            <div class="card">
                <img src="https://www.thehypemagazine.com/wp-content/uploads/2024/06/unnamed-2024-06-28T002959.859.jpg" alt="Product">
                <p>Product Card 1</p>
            </div>
            <div class="card">
                <img src="https://tse4.mm.bing.net/th/id/OIP.iU2eWEFrmLlr0fpI0w51CQHaD4?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Product">
                <p>Product Card 2</p>
            </div>
            <div class="card">
                <img src="https://i1.sndcdn.com/artworks-deadkPWw7VBpPccS-k6yE5g-t500x500.jpg" alt="Product">
                <p>Product Card 3</p>
            </div>
            <div class="card">
                <img src="https://i1.sndcdn.com/artworks-IUtmIdD4YEWA-0-t500x500.jpg" alt="Product">
                <p>Product Card 4</p>
            </div>
            <div class="card">
                <img src="https://images.genius.com/ad8dd9ec24551cec128e9ebb15f3e0ac.500x500x1.jpg" alt="Product">
                <p>Product Card 5</p>
            </div>
            <div class="card">
                <img src="https://malawi24.com/wp-content/uploads/2023/10/DJ-Maphorisa.jpeg" alt="Product">
                <p>Product Card 6</p>
            </div>
        </main>

        <aside class="ads">
            <h3>ADS</h3>
            <img src="https://via.placeholder.com/160x600?text=Banner+Ads" alt="Quảng cáo">
        </aside>

        <footer class="footer">
            <h2>FOOTER (Full Width)</h2>
        </footer>

    </div>
</body>
</html>
