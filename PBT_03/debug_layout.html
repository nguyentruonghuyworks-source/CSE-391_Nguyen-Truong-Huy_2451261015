<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Debug CSS Layout</title>
    <link rel="stylesheet" href="debug_layout.css">
</head>
<body>
    <h2>Cách 1: Sử dụng box-sizing: border-box</h2>
    <div class="container">
        <div class="sidebar fix1-sidebar">Sidebar (Border-box)</div>
        <div class="content fix1-content">Content (Border-box)</div>
    </div>
    
    <div style="clear: both;"></div>

    <h2>Cách 2: Không dùng border-box</h2>
    <div class="container">
        <div class="sidebar fix2-sidebar">Sidebar (Tính lại Width)</div>
        <div class="content fix2-content">Content (Tính lại Width)</div>
    </div>
</body>
</html>
