<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
    <h2>Phần 1: Chứng minh content-box vs border-box</h2>
    <div class="box-container">
        <div class="box box-content">
            Hộp 1 (content-box)
        </div>
        
        <div class="box box-border">
            Hộp 2 (border-box)
        </div>
        
        <div style="clear: both;"></div>
    </div>

    <h2>Phần 2: Layout 3 cột (Sử dụng border-box)</h2>
    <div class="container-1000">
        <div class="col sidebar">Sidebar (Trái)</div>
        <div class="col content">Content (Giữa)</div>
        <div class="col ads">Ads (Phải)</div>

        <div style="clear: both;"></div>
    </div>
</body>
</html>
