<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <h2>4. Loading Spinner</h2>
    <div class="spinner"></div>

    <h2>1, 2, 3, 5. Product Cards với Hiệu ứng</h2>
    <div class="product-grid">
        <div class="card fade-in">
            <div class="image-container">
                <img src="https://m.media-amazon.com/images/I/61myWnDdRVL.jpg" alt="Product 1">
            </div>
            <div class="card-content">
                <h3>Sản phẩm 1</h3>
                <button class="buy-btn">Mua ngay</button>
            </div>
        </div>
        
        <div class="card fade-in" style="animation-delay: 0.2s;">
            <div class="image-container">
                <img src="https://d287ku8w5owj51.cloudfront.net/images/products/hero/sound-blaster-audigy-fx/pdt-mhl-audigy-fx.png" alt="Product 2">
            </div>
            <div class="card-content">
                <h3>Sản phẩm 2</h3>
                <button class="buy-btn">Mua ngay</button>
            </div>
        </div>
    </div>
</body>
</html>
