<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header class="header">
        <div class="logo">MyStore</div>
        <div class="hamburger">☰</div>

        <nav class="nav-menu">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Sản phẩm</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>
    </header>
    <div class="main-wrapper">
        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <select class="filter-dropdown">
                <option>Tất cả sản phẩm</option>
                <option>Giá tăng dần</option>
                <option>Giá giảm dần</option>
            </select>
        </aside>

        <main class="product-grid">
            <div class="card"><img src="https://pisces.bbystatic.com/image2/BestBuy_US/images/products/6504/6504985_sd.jpg" alt="Product 1"><h4>Sản phẩm 1</h4><p>100.000đ</p></div>
            <div class="card"><img src="https://tse3.mm.bing.net/th/id/OIP.UF1OiJiE9ysnDslk_bhxSQCgEs?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Product 2"><h4>Sản phẩm 2</h4><p>200.000đ</p></div>
            <div class="card"><img src="https://i.pinimg.com/originals/07/9c/cc/079ccc5d126bf2a5ecefcaf422ff335a.jpg" alt="Product 3"><h4>Sản phẩm 3</h4><p>300.000đ</p></div>
            <div class="card"><img src="https://tse1.mm.bing.net/th/id/OIP.wQ9HwA61_njyxZl2pSw7AgHaEK?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Product 4"><h4>Sản phẩm 4</h4><p>400.000đ</p></div>
            <div class="card"><img src="https://cdn.shopify.com/s/files/1/0409/7245/products/pinkgold_a676f77a-e618-437a-952f-4ca174b9e7fc_1800x1800.png" alt="Product 5"><h4>Sản phẩm 5</h4><p>500.000đ</p></div>
            <div class="card"><img src="hhttps://tse3.mm.bing.net/th/id/OIP.gowt_nDkyPfIVum6JKC9-QHaHa?pid=ImgDet&w=194&h=194&c=7&o=7&rm=3" alt="Product 6"><h4>Sản phẩm 6</h4><p>600.000đ</p></div>
            <div class="card"><img src="https://tse3.mm.bing.net/th/id/OIP.IgyG1ev33u62K2v2xZlEzAHaGF?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Product 7"><h4>Sản phẩm 7</h4><p>700.000đ</p></div>
            <div class="card"><img src="https://tse3.mm.bing.net/th/id/OIP.H2XFahai8SmnMa9LCAxSKwHaFj?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Product 8"><h4>Sản phẩm 8</h4><p>800.000đ</p></div>
        </main>

        <aside class="ads-bar">
            <h3>Quảng cáo</h3>
            <div class="ad-banner">
                <img src="https://tse2.mm.bing.net/th/id/OIP.qGc7CvSes84YEk1KfPvaIwHaEK?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Sale Banner">
            </div>
        </aside>
    </div>

    <footer class="footer">
        <p>&copy; 2026 MyStore. All rights reserved.</p>
    </footer>
</body>
</html>
